# MFlow thresholds — the single source for every pass/warn/fail decision.
# Skills quote these names; override any value with ./mflow_thresholds.yaml or $MFLOW_THRESHOLDS
# (only the keys you set are replaced).

check:                         # mflow check / train pre-flight
  force_warn_eV_A: 50.0        # a single force component
  force_fail_eV_A: 200.0
  min_distance_A: 0.6
  energy_outlier_mad: 6.0      # robust z of the per-element-fit residual
  min_frames: 50
  min_group: 10
  e0_offset_warn_eV_atom: 0.4  # zero-shot raw offset that hints at mismatched DFT settings

train:                         # mflow train-report
  grade_excellent: {energy_meV_atom: 5.0, force_meV_A: 20.0}
  grade_good: {energy_meV_atom: 10.0, force_meV_A: 50.0}
  overfit_ratio: 1.5           # final / best validation loss

uq:                            # committee calibration
  spearman_pass: 0.5
  spearman_warn: 0.2
  collapse_ratio: 3.0          # RMS(error) / RMS(sigma) at or above this: the committee has collapsed
                               #   (spread < 1/3 of the real error; arXiv:2605.03964, 2508.09907)

md:                            # mflow md-report gates
  nve_drift_pass_eV_atom_ps: 5.0e-4   # LAMBench tolerance
  nve_drift_warn_eV_atom_ps: 5.0e-3
  temperature_pass: 0.05       # |mean - target| / target
  temperature_warn: 0.15
  temperature_trend: 0.05      # linear change over the production window / target
  volume_pass: 0.02            # NPT change over production
  volume_warn: 0.05
  min_distance_A: 0.6
  halt_factor: 5.0             # fix halt when T > factor × target

consistency:                   # mflow md run-0 check: energy eV/atom, force eV/Å, pressure abs bar, relative
  float64: [1.0e-5, 1.0e-4, 1.0, 1.0e-4]
  float32: [1.0e-3, 2.0e-2, 100.0, 1.0e-2]

validate:                      # mflow validate
  ref_pass: 0.10               # |model - reference| / |reference|
  ref_warn: 0.25
  dimer_jump_eV: 0.05          # MLIP Arena energy-jump (Σ |ΔE| around each extra extremum)
  dimer_conservation_eV_A: 0.05  # mean |F + dE/dr|
  dimer_tail_eV: 0.01          # |E(r_max)| — should vanish beyond the cutoff
  imaginary_THz: 0.1           # frequencies below -this count as imaginary (Γ acoustic noise is smaller)

al:                            # active learning (v0.2; v0.3 convergence below)
  trust_lo_eV_A: 0.05          # DP-GEN example window; "auto" replaces lo with Q3 + 1.5 IQR of the
  trust_hi_eV_A: 0.15          #   committee deviation on the training set
  relative_floor_eV_A: 0.2     # sigma / (|F| + floor) for -trust relative
  relative_lo: 0.05
  relative_hi: 0.30
  max_per_round: 150
  stop_candidate_fraction: 0.05
  stop_dft_energy_meV_atom: 10.0
  stop_dft_force_meV_A: 50.0
  # -- v0.3 convergence (docs/research-al-2026-10.md §3). [lit] = published value, [sug] = suggested default
  accurate_min: 0.99           # [lit] DP-GEN (Wen et al. 2022): stop labelling once > 99 % of frames are accurate
  failed_max: 0.001            # [sug] fraction above hi
  consecutive: 2               # [lit] dpgen2 n_checked_steps: a criterion must hold this many rounds in a row
  selected_left_min: 10        # [sug] converged when FPS leaves fewer than max(this, frac × explored) frames
  selected_left_frac: 0.001
  fresh_vs_test: 1.5           # [sug] first-seen force RMSE / test RMSE of the model that explored
  md_failed_max: 0.0           # [sug] fraction of exploration MD runs allowed to crash / blow up
  ood_max: 0.01                # [sug] fraction of explored frames out of the training distribution
  ood_quantile: 0.99           # [sug] descriptor OOD threshold = this quantile of the training set's own
                               #   leave-one-out nearest-neighbour distances
  adaptive_numb_candi: 200     # [lit] dpgen2 adaptive-lower: lo is set so max(numb, rate × N) frames are
  adaptive_rate_candi: 0.01    #   candidates
  adaptive_hi_eV_A: 0.5        # [lit] dpgen2 default level_f_hi
  adaptive_conv_tol_eV_A: 0.05 # [lit] dpgen2 conv_tolerance: lo stable within this over `consecutive` rounds
  adaptive_hi_offset_eV_A: 0.15  # [sug] once lo is frozen: hi = lo + offset
  probe_tol:                   # [sug] property probes, change between rounds and spread between members
    eos_V0_rel: 0.005
    eos_B0_rel: 0.05
    dimer_rmin_A: 0.02
    dimer_Emin_eV: 0.02
    phonon_max_THz: 0.2
