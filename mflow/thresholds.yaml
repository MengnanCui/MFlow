# MFlow thresholds — the single source for every pass/warn/fail decision.
# Skills quote these names; override any value with ./mflow_thresholds.yaml or $MFLOW_THRESHOLDS
# (only the keys you set are replaced).

check:                         # mflow check / train pre-flight
  force_warn_eV_A: 50.0        # a single force component
  force_fail_eV_A: 200.0
  min_distance_A: 0.6
  energy_outlier_mad: 6.0      # robust z of the per-element-fit residual
  min_frames: 50
  min_group: 10
  e0_offset_warn_eV_atom: 0.4  # zero-shot raw offset that hints at mismatched DFT settings

train:                         # mflow train-report
  grade_excellent: {energy_meV_atom: 5.0, force_meV_A: 20.0}
  grade_good: {energy_meV_atom: 10.0, force_meV_A: 50.0}
  overfit_ratio: 1.5           # final / best validation loss

uq:                            # committee calibration
  spearman_pass: 0.5
  spearman_warn: 0.2

md:                            # mflow md-report gates
  nve_drift_pass_eV_atom_ps: 5.0e-4   # LAMBench tolerance
  nve_drift_warn_eV_atom_ps: 5.0e-3
  temperature_pass: 0.05       # |mean - target| / target
  temperature_warn: 0.15
  temperature_trend: 0.05      # linear change over the production window / target
  volume_pass: 0.02            # NPT change over production
  volume_warn: 0.05
  min_distance_A: 0.6
  halt_factor: 5.0             # fix halt when T > factor × target

consistency:                   # mflow md run-0 check: energy eV/atom, force eV/Å, pressure abs bar, relative
  float64: [1.0e-5, 1.0e-4, 1.0, 1.0e-4]
  float32: [1.0e-3, 2.0e-2, 100.0, 1.0e-2]

al:                            # active learning (v0.2)
  trust_lo_eV_A: 0.05          # DP-GEN example window; "auto" replaces lo with Q3 + 1.5 IQR of the
  trust_hi_eV_A: 0.15          #   committee deviation on the training set
  relative_floor_eV_A: 0.2     # sigma / (|F| + floor) for -trust relative
  relative_lo: 0.05
  relative_hi: 0.30
  max_per_round: 150
  stop_candidate_fraction: 0.05
  stop_dft_energy_meV_atom: 10.0
  stop_dft_force_meV_A: 50.0
